services:
  rewards-dashboard:
    image: ghcr.io/mgrimace/rewards-dashboard:latest
    #build:
      #context: ./rewards-dashboard
    container_name: rewards-dashboard
    restart: unless-stopped
    ports:
      - "8890:8890"
    environment:
      PORT: "8890"

      # URL of the bot's Control API (scripts/api/server.js).
      #  - If the Control API runs as a container on a shared Docker
      #    network, use its service/container name, e.g.
      #    http://microsoft-rewards-script:3010
      #  - If it runs on the Docker host, use
      #    http://host.docker.internal:3010 and uncomment extra_hosts below.
      CONTROL_API_URL: "http://microsoft-rewards-script:3010"

      # Shared secret — must match the Control API's API_TOKEN. Sourced
      # from your shell / a .env file beside this compose.yaml. Leave it
      # unset only if the API runs without a token.
      CONTROL_API_TOKEN: "${API_TOKEN}"

      # Your timezone, so the daily point buckets line up (e.g.
      # Europe/Amsterdam). Defaults to UTC.
      TZ: "America/Toronto"

      # Optional.
      # DASHBOARD_TITLE: 'Microsoft Rewards'
      # POLL_MS: '5000'      # status poll; logs are streamed
      # LOG_REPLAY: '300'    # log lines replayed when the stream connects

    # The dashboard is the only side that stores anything: point history,
    # runs, activity and the schedule, all in ./data/dashboard.sqlite. The
    # bot's Control API is stateless and writes nothing.
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
