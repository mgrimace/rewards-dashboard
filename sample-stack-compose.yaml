# An example compose stack with both the script and the dashboard together.
# References v4.0.3 of the microsoft-rewards-script's compose. This example may be out of date, always use updated values.

services:
  microsoft-rewards-script:
    image: ghcr.io/thenetsky/microsoft-rewards-script:latest
    #build:
    #    context: .
    container_name: microsoft-rewards-script
    restart: unless-stopped
    volumes:
      - ./config:/usr/src/microsoft-rewards-script/config
      - ./sessions:/usr/src/microsoft-rewards-script/sessions
    env_file:
      - path: .env
    environment:
      # ── Scheduler ──────────────────────────────────────
      TZ: 'America/Toronto'
      NODE_ENV: 'production'
      CRON_SCHEDULE: '0 7,19 * * *'
      RUN_ON_START: 'true'
      SKIP_RANDOM_SLEEP: 'false'
      #MIN_SLEEP_MINUTES: "5"
      #MAX_SLEEP_MINUTES: "50"
      #STUCK_PROCESS_TIMEOUT_HOURS: "8"

      # ── API mode ──────────────────────────────────────
      # Set API_MODE=true to run the API server for additional control options
      API_MODE: 'true'
      API_TOKEN: '${API_TOKEN}'             # required for API mode, see example.env
      API_ALLOW_SCHEDULE_WRITE: 'true'
      API_ALLOW_ENV_OVERRIDES: 'true'
      API_ALLOW_CONFIG_REVEAL: 'true'
      API_ALLOW_CONFIG_WRITE: 'true'
      
      #  ── Configuration ──────────────────────────────────────
      # Uncomment to override defaults, a full list of configuration options are in the README.
      #CONFIG_CLUSTERS: '1'
      #... add additional configuration overrides as needed

    ports:
      - '3010:3010'
    
    healthcheck:
        test: ['CMD-SHELL', 'pgrep -x node >/dev/null 2>&1 || pgrep -x cron >/dev/null 2>&1']
        interval: 60s
        timeout: 5s
        retries: 3
        start_period: 30s

    security_opt:
      - no-new-privileges:true

  rewards-dashboard:
    image: ghcr.io/mgrimace/rewards-dashboard:latest
    #build:
    #  context: ./rewards-dashboard
    container_name: rewards-dashboard
    restart: unless-stopped
    ports:
      - "8890:8890"
    environment:
      CONTROL_API_URL: "http://microsoft-rewards-script:3010"
      CONTROL_API_TOKEN: "${API_TOKEN}"
      TZ: "America/Toronto"
      # Optional.
      # DASHBOARD_TITLE: 'Microsoft Rewards'
      # POLL_MS: '5000'      # status poll; logs are streamed
      # LOG_REPLAY: '300'    # log lines replayed when the stream connects
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true